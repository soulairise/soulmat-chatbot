# 소울매트 챗봇 — OpenAI 프록시
#
# 이 워커가 존재하는 이유는 하나다. **키를 공개 페이지에 둘 수 없기 때문이다.**
# 챗봇은 GitHub Pages 에 올라가는 정적 사이트라, 프런트엔드에 키를 넣으면
# 빌드된 JS 에 그대로 박혀 누구나 꺼내 쓴다. 요금은 저장소 주인에게 청구된다.
#
# 그래서 키는 여기 시크릿으로만 둔다. 설정은 코드가 아니라 명령으로 넣는다.
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put ACCESS_CODE
name = "soulmat-chatbot-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# 이 목록에 있는 출처에서만 호출을 받는다. 그 외에는 CORS 로 막힌다.
ALLOWED_ORIGINS = "https://soulairise.github.io,http://localhost:5173"
# 발급처가 자체 게이트웨이를 쓰면 이 값을 그 주소로 바꾼다 (끝의 /v1 까지).
# 비워 두면 OpenAI 본사(https://api.openai.com/v1) 로 간다.
# OPENAI_BASE_URL = "https://..../v1"
CHAT_MODEL = "gpt-5.6-terra"
EMBED_MODEL = "text-embedding-3-small"
