name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # 벡터스토어(public/soulmat-docs.json)는 저장소에 커밋되어 있다.
      # CI에는 Ollama가 없으므로 여기서 임베딩을 다시 만들지 않는다.
      # 프록시 주소는 키가 아니라 **주소**다. 번들에 박혀도 무방하다.
      # 키는 Cloudflare 워커 시크릿에만 있고, 이 저장소에도 번들에도 없다.
      - run: npm run build
        working-directory: app
        env:
          VITE_PROXY_URL: https://soulmat-chatbot-proxy.soulmat.workers.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
